  <!DOCTYPE html>
  <html lang="tr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tıp Fakültesi — Belge Görüntüleme</title>

  <style>

  :root{
    --blue:#3f67b0;
    --blue-strong:#1b5fc6;
    --bg:#f2f4f8;
    --shadow:0 12px 35px rgba(0,0,0,0.08);
  }

  body{
    margin:0;
    background:var(--bg);
    font-family:"Segoe UI",Arial,sans-serif;
  }

  /* HEADER */
  header{
    background:#fff;
    padding:20px 45px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
  }

  header img{
    height:75px;
    transition:.25s;
  }

  header img:hover{
    transform:scale(1.06);
  }

  header h1{
    font-size:27px;
    font-weight:800;
    color:#1b5fc6;
  }

  /* MAIN CONTAINER */
  #mainBox{
    width:92%;
    max-width:1150px;
    margin:35px auto;
    background:#fff;
    padding:35px;
    border-radius:16px;
    box-shadow:var(--shadow);
  }

  /* TITLE */
  .sectionLabel{
    font-size:24px;
    font-weight:800;
    color:#1b5fc6;
    margin-bottom:20px;
  }

  /* INFO BOX */
  .info-wrapper{
    background:#eef3ff;
    border-left:6px solid var(--blue);
    padding:22px 26px;
    border-radius:12px;
    margin-bottom:30px;
    box-shadow:0 3px 12px rgba(0,0,0,0.06);
  }

  .info-row{
    font-size:19px;
    margin-bottom:10px;
    font-weight:700;
    display:flex;
    justify-content:space-between;
  }

  .info-row span{
    font-weight:600;
    color:#000;
  }

  /* PDF AREA BOX */
  #pdfAreaBox{
    background:white;
    padding:20px;
    border-radius:14px;
    border:1px solid #ccc;
    box-shadow:var(--shadow);
    margin-bottom:25px;
  }

  /* Action buttons */
  .pdf-actions{
    display:flex;
    gap:15px;
    margin-bottom:15px;
  }

  .pdf-btn{
    padding:12px 22px;
    background:#3f67b0;
    color:white;
    font-size:18px;
    border-radius:10px;
    border:0;
    cursor:pointer;
    transition:.25s;
  }

  .pdf-btn:hover{
    background:#1b5fc6;
    transform:translateY(-2px);
  }

  /* SCROLL CONTAINER */
  #pdfScroll{
    width:100%;
    height:750px;                /* ✅ حجم ثابت */
    overflow-y:auto;             /* ✅ سكرول داخلي */
    overflow-x:hidden;
    padding-right:10px;
    scroll-behavior:smooth;
    background:white;
    border-radius:10px;
  }

  /* PDF PAGE STYLE */
  .pdfPage{
    display:block;
    margin:25px auto;
    border-radius:10px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    border:1px solid #ccc;
    background:white;
    transition:.3s;
  }

  /* فاصـل بين الصفحات */
  .page-separator{
    width:100%;
    height:35px;
    margin:10px 0;
    background:linear-gradient(to right, #eee, #fff);
    border-radius:4px;
  }

  /* FOOTER */
  footer{
    text-align:center;
    padding:20px 0;
    color:#777;
    margin-top:30px;
    font-size:15px;
  }

  </style>
  </head>

  <body>

  <header>
    <a href="https://www.bilecik.edu.tr/tip" target="_blank">
      <img src="IMG_2383.jpeg">
    </a>

    <h1>Tıp Fakültesi</h1>

    <a href="https://www.bilecik.edu.tr" target="_blank">
      <img src="IMG_2388.png">
    </a>
  </header>

  <div id="mainBox">

    <div class="sectionLabel">Belge Görüntüleme</div>

    <!-- INFO BOX -->
    <div class="info-wrapper">

        <div class="info-row">
          <div>Öğrenci No:</div>
          <span>99450604074</span>
        </div>

        <div class="info-row">
          <div>T.C. Kimlik No:</div>
          <span>99450604074</span>
        </div>

        <div class="info-row">
          <div>Adı:</div>
          <span>MOHAMED GOMAA RASHED</span>
        </div>

        <div class="info-row">
          <div>Soyadı:</div>
          <span>ELWARAKY</span>
        </div>

        <div class="info-row">
          <div>Doğum Tarihi:</div>
          <span>02/09/2002</span>
        </div>

    </div>

    <!-- PDF AREA -->
    <div id="pdfAreaBox">

      <!-- buttons -->
      <div class="pdf-actions">
        <button class="pdf-btn" onclick="printPDF()">Yazdır</button>

        <a class="pdf-btn" href="99450604074_Transkript..pdf" download>indir</a>
      </div>

      <!-- scrollable pdf viewer -->
      <div id="pdfScroll">
        <div id="pdfArea"></div>
      </div>

    </div>

  </div>

  <footer>
    © Bilecik Şeyh Edebali Üniversitesi | Öğrenci İşleri Daire Başkanlığı
  </footer>

  <script>
  /* ================================
     LOAD PDF.js FROM CDN
     ================================ */

  const PDF_URL = "99450604074_Transkript.pdf";

  const pdfjsVersion = "3.11.174";
  const workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${pdfjsVersion}/pdf.worker.min.js`;
  const scriptSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${pdfjsVersion}/pdf.min.js`;

  function loadScript(src){
    return new Promise((resolve)=>{
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      document.body.appendChild(s);
    });
  }

  (async()=>{

    await loadScript(scriptSrc);

    pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;

    const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
    const total = pdf.numPages;

    const container = document.getElementById("pdfArea");

    for(let i=1; i<=total; i++){

      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.0 });

      const canvas = document.createElement("canvas");
      canvas.className = "pdfPage";
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      container.appendChild(canvas);

      await page.render({ canvasContext: ctx, viewport }).promise;

      if(i < total){
        const sep = document.createElement("div");
        sep.className = "page-separator";
        container.appendChild(sep);
      }
    }

  })();

  /* PRINT */
  function printPDF(){
    const w = window.open(PDF_URL,'_blank');
    w.print();
  }
  </script>

  </body>
  </html>
